<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>논문 정독 노트</title>
<style>
:root { --bg: #f5f6f8; --card: #fff; --ink: #1a2130; --ink-2: #4b5566; --rule: #dfe3ea; --accent: #2a4a7f; }
@media (prefers-color-scheme: dark) { :root { --bg: #11151c; --card: #181d26; --ink: #e7eaf0; --ink-2: #b3bbc8; --rule: #2b3341; --accent: #9dbbe9; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
h1 { font-size: 26px; margin: 0 0 6px; }
p.sub { color: var(--ink-2); margin: 0 0 24px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
a.card { display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--accent); }
.ko { font-weight: 600; }
.en { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
.meta { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>논문 정독 노트</h1>
  <p class="sub">문장별 역할·번역·분석과 리뷰 검토를 붙인 논문 정독 페이지 모음입니다.</p>
  <ul>
    <li><a class="card" href="hrdr-2023/">
      <div class="ko">격심한 동적 가진을 받는 구조물을 위한 하이브리드 고무 감쇠–변위구속 장치(HRDR) 개발</div>
      <div class="en">Development of hybrid rubber damper-restrainer (HRDR) system for structures under sever dynamic excitation</div>
      <div class="meta">Mandani, Hejazi, Nikkhoo · Structures 55 (2023) · CC BY 4.0</div>
    </a></li>
  </ul>
</main>
</body>
</html>
